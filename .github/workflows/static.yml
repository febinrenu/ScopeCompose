# Verify, build and (when approved) publish the project site.
#
#   verify  The browser engines in site/public/engine/ reimplement parts of the
#           Python pipeline in JavaScript so the detector runs in the page. A
#           port that drifts from the Python makes the page compute a different
#           relation from the pipeline, which is worse than a screenshot because
#           it still looks authoritative. The replay below fails the build
#           rather than shipping that.
#
#   build   The site is a Vite + TypeScript build (site/package.json). Type
#           check, unit and golden tests, production build, a check that the
#           engines ship byte-identical, weight budgets, and a headless-Chrome
#           smoke test. The built site/dist is uploaded as the Pages artifact.
#
#   deploy  DISABLED on purpose. Publishing makes unpublished research results
#           public, and that is the supervisor's decision (see site/README.md,
#           "Deploying"). To enable: remove `if: false` below, and switch Pages
#           on once in Settings -> Pages -> Source: GitHub Actions.

name: Site — verify, build, deploy

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Only these three are needed. torch and transformers are imported
      # lazily inside CrossEncoderNLI, which the reference never constructs.
      - name: Install the reference generator's dependencies
        run: pip install --quiet pydantic pyyaml numpy

      # Regenerate and diff. Without this the gate only replays whatever was
      # committed, so editing scope/attributes.py and forgetting to rebuild
      # the reference passes green on a stale port -- verifying the JS
      # against its own outdated expectations.
      - name: Reference must be current
        run: |
          python site/tools/make_reference.py
          git diff --exit-code -- site/tools/compare_reference.json \
            || { echo "::error::compare_reference.json is stale. Run python site/tools/make_reference.py"; exit 1; }

      # The same argument for the corpus the page reads.
      - name: Corpus must be current
        run: |
          python site/build_data.py
          git diff --exit-code -- site/public/data \
            || { echo "::error::site/public/data is stale. Run python site/build_data.py"; exit 1; }

      - name: Verify the browser engines against Python
        run: node site/tools/verify_engines.js

  build:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit, golden and boundary tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Engines ship byte-identical, in order, never re-bundled
        run: npm run check:dist
      - name: Weight budgets
        run: npm run size
      # Uses the Chrome preinstalled on ubuntu-latest; no browser download.
      - name: Smoke test in headless Chrome
        run: npm run smoke
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    # Disabled deliberately: publishing makes unpublished results public.
    # Re-enable only after supervisor sign-off (see site/README.md, "Deploying").
    if: false
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
