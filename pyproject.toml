[project]
name = "conflict-rag"
version = "0.1.0"
description = "Detecting and resolving conditional knowledge conflicts in RAG"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a model download or GPU; deselect with -m 'not slow'",
    "network: touches a live API; deselect with -m 'not network'. Never run in CI.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
